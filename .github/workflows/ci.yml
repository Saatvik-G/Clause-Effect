name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build (No Secrets Required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npx eslint .

      - name: Run Unit & Eval Tests
        run: npx vitest run

      - name: Build Production Bundle
        run: npx next build
